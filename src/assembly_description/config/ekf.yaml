ekf_filter_node:
    ros__parameters:
 
        frequency: 30.0
        two_d_mode: true
        publish_tf: true
 
        map_frame: map                  
        odom_frame: odom                 
        base_link_frame: base_footprint  
        world_frame: odom                
 
        # Wheel Odometry (Fusing vx, vy, and vyaw)
        odom0: /diff_cont/odom
        odom0_config: [false, false, false,
                       false, false, false,
                       true,  true,  false,
                       false, false, true,
                       false, false, false]
        
        # IMU Data (Fusing absolute yaw and vyaw)
        imu0: /imu_broad/imu
        imu0_config: [false, false, false,
                      false, false, true,
                      false, false, false,
                      false, false, true,
                      false, false, false]
        
        imu0_remove_gravitational_acceleration: false